<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ukraine War Updates</title>
<meta name="description" content="דף בית על מפת אוקראינה ותצוגת עדכוני חזית במסך מלא עם ניווט וחלון הגדלה.">
<style>
  :root{
    --ink:#0f172a; --ink2:#334155; --ring:#c7dcff;
    --panel: rgba(255,255,255,.92);
    --hdr: 56px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial;color:var(--ink);background:#f1f5f9;overflow:hidden}

  /* ===== HEADER ===== */
  header{
    position:fixed; inset-inline:0; top:0; z-index:30; height:var(--hdr);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 clamp(12px,3vw,28px);
    background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.78));
    backdrop-filter:saturate(1.1) blur(6px); border-bottom:1px solid #e2e8f0;
  }
  .brand{font-weight:800}
  .hint{font-size:12px; color:var(--ink2)}

  /* ===== HOME ===== */
  #homeView{ position:fixed; inset:var(--hdr) 0 0 0; display:block; }
  .home-bg{ position:absolute; inset:0; z-index:0; background-size:cover; background-position:center; }
  .home-glass{ position:absolute; inset:0; z-index:1; backdrop-filter:blur(6px); background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.88)); }
  .home-inner{ position:relative; z-index:2; height:100%; padding:18px clamp(12px,3vw,28px); display:grid; grid-template-rows:auto 1fr; }
  .front-grid{ align-self:start; display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); }
  .front-card{
    cursor:pointer; user-select:none; border:1px solid #e2e8f0; border-radius:16px; padding:14px;
    background:var(--panel); box-shadow:0 10px 26px rgba(2,6,23,.05);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    text-align:center; font-weight:700;
  }
  .front-card:hover{ transform:translateY(-2px); border-color:var(--ring); box-shadow:0 12px 30px rgba(11,107,203,.08) }
  .front-card small{ display:block; margin-top:6px; color:var(--ink2); font-weight:500 }

  /* ===== DETAIL (FULLSCREEN) ===== */
  #detailView{ position:fixed; inset:var(--hdr) 0 0 0; display:none; }
  .detail-ui{
    position:fixed; top:0; inset-inline:0; height:var(--hdr); z-index:40;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:0 clamp(10px,3vw,18px);
    color:#fff; background:linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,.35));
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  .title{font-weight:800}
  .date-badge{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); padding:4px 10px; border-radius:999px; font-size:13px}

  /* במה = תמונה במסך מלא + רקע מטושטש מאותה תמונה */
  .stage{
    position:fixed; top:var(--hdr); left:0; right:0; bottom:0; overflow:hidden;
    display:grid; place-items:center;
    background:#000; background-size:cover; background-position:center;
  }
  .stage::before{ content:""; position:absolute; inset:0; z-index:0; backdrop-filter: blur(18px) saturate(1.05); opacity:.9; }
  .stage img{
    position:relative; z-index:1; width:100vw; height:calc(100vh - var(--hdr));
    object-fit:contain; display:block; background:transparent;
  }

  /* פס בקרה ימני קבוע */
  .side-controls{
    position:fixed; right:12px; top:calc(var(--hdr) + 50%); transform:translateY(-50%);
    z-index:41; display:flex; flex-direction:column; gap:10px; align-items:center;
  }
  .btn{
    border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.15); color:#fff;
    border-radius:12px; padding:10px 12px; cursor:pointer; font-weight:800; min-width:46px; min-height:46px;
    box-shadow:0 6px 18px rgba(0,0,0,.25); backdrop-filter:saturate(1.1) blur(2px);
  }
  .btn:disabled{opacity:.5; cursor:not-allowed}
  .btn.home{padding:10px 16px}
  .btn.big{font-size:20px; line-height:1}
  .btn.zoom{font-size:18px}

  /* כיתוב תחתון */
  .caption{
    position:fixed; bottom:10px; inset-inline:10px; z-index:41;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    color:#e5e7eb; font-size:13px;
    background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.45));
    padding:12px 10px; border-radius:12px; pointer-events:none;
  }
  .status{ border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.12); padding:4px 8px; border-radius:8px; }
  .status.ok{ color:#bbf7d0; border-color:#bbf7d0; }
  .status.err{ color:#fecaca; border-color:#fecaca; }
  .loading{ position:fixed; inset:var(--hdr) 0 0 0; display:grid; place-items:center; color:#e5e7eb; font-weight:700; pointer-events:none; }

  /* ===== ZOOM OVERLAY (no blur on the image itself) ===== */
  #zoomOverlay{
    position:fixed; inset:0; z-index:100; display:none;
    background:rgba(0,0,0,.75);
    cursor:grab;
  }
  #zoomOverlay.grabbing{ cursor:grabbing; }
  #zoomImg{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(1);
    will-change:transform; user-select:none; -webkit-user-drag:none;
    max-width:none; max-height:none;
    image-rendering:auto; /* חדות רגילה */
  }
  .zoom-controls{
    position:fixed; right:12px; bottom:12px; z-index:101; display:flex; gap:8px;
  }
  .zoom-controls .btn{ background:rgba(255,255,255,.2) }
</style>
</head>
<body>

<header>
  <div class="brand">Ukraine War Updates</div>
  <div class="hint">טיפ: ← / → לניווט בין תאריכים • לחצו 🔍 להגדלה</div>
</header>

<!-- ===== HOME ===== -->
<section id="homeView" aria-label="דף הבית">
  <div id="homeBg" class="home-bg"></div>
  <div class="home-glass"></div>
  <div class="home-inner">
    <h2 style="margin:0 0 10px 0;">בחר חזית:</h2>
    <div id="frontGrid" class="front-grid"></div>
  </div>
</section>

<!-- ===== DETAIL ===== -->
<section id="detailView" aria-live="polite">
  <div class="detail-ui">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="title" id="frontTitle">—</span>
      <span class="date-badge" id="dateBadge">—</span>
    </div>
    <div></div>
  </div>

  <div class="stage" id="stage">
    <div class="loading" id="loading" hidden>טוען…</div>
    <img id="frontImage" alt="עדכון חזית" />
  </div>

  <!-- פס הבקרה הימני -->
  <div class="side-controls" aria-label="בקרת ניווט">
    <button class="btn home" id="homeBtn" title="חזרה לבית">בית</button>
    <button class="btn big"  id="prevBtn" title="עדכון קודם" aria-label="עדכון קודם">⟵</button>
    <button class="btn big"  id="nextBtn" title="עדכון הבא" aria-label="עדכון הבא">⟶</button>
    <button class="btn zoom" id="zoomBtn" title="הגדלת תמונה" aria-label="הגדלת תמונה">🔍</button>
  </div>

  <div class="caption">
    <div id="captionLeft">—</div>
    <div id="captionRight" class="status">—</div>
  </div>
</section>

<!-- ===== ZOOM OVERLAY ===== -->
<div id="zoomOverlay">
  <img id="zoomImg" alt="תמונה מוגדלת" />
  <div class="zoom-controls">
    <button class="btn" id="zoomIn">+</button>
    <button class="btn" id="zoomOut">−</button>
    <button class="btn" id="zoomReset">איפוס</button>
    <button class="btn" id="zoomClose">סגור</button>
  </div>
</div>

<script>
/* ===== helpers ===== */
const fmtDate = d => d.toLocaleDateString('he-IL',{year:'numeric',month:'2-digit',day:'2-digit'});
const $ = id => document.getElementById(id);

/* ===== state & elements ===== */
let CFG=null;
const state = { filesByFront:new Map(), indexByFront:new Map(), currentKey:null };
const el = {
  home: $('homeView'), grid: $('frontGrid'), homeBg: $('homeBg'),
  detail: $('detailView'),
  title: $('frontTitle'), badge: $('dateBadge'),
  img: $('frontImage'), loading: $('loading'),
  prev: $('prevBtn'), next: $('nextBtn'), homeBtn: $('homeBtn'), zoomBtn: $('zoomBtn'),
  capLeft: $('captionLeft'), capRight: $('captionRight'),
  stage: $('stage'),
  zoomOverlay: $('zoomOverlay'), zoomImg: $('zoomImg'),
  zoomIn: $('zoomIn'), zoomOut: $('zoomOut'), zoomReset: $('zoomReset'), zoomClose: $('zoomClose')
};

function showHome(){ history.replaceState({},'',location.pathname); el.detail.style.display='block'; el.home.style.display='block'; el.detail.style.display='none'; }
function showDetail(){ el.home.style.display='none'; el.detail.style.display='block'; }
function setLoading(on){ el.loading.hidden = !on; }
function setImgError(msg){ el.img.removeAttribute('src'); el.capRight.className='status err'; el.capRight.textContent=msg; setLoading(false); }

/* ===== GitHub I/O ===== */
function rawUrl(path){ const {owner,repo,branch}=CFG.repo; return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${encodeURI(path)}`; }
async function ghList(path){
  const {owner,repo,branch}=CFG.repo;
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}?ref=${encodeURIComponent(branch)}`;
  const res = await fetch(url,{headers:{'Accept':'application/vnd.github+json'}}); if(!res.ok) throw new Error('GitHub API '+res.status);
  return res.json();
}
function extractDateFromFilename(name){
  const m = name.toLowerCase().match(/-(\d{4})-(\d{1,2})-(\d{1,2})\.(png|jpe?g|webp)$/i);
  if(!m) return null; const d = new Date(+m[1], +m[2]-1, +m[3]); return isNaN(+d)?null:d;
}
async function loadFrontFiles(frontKey){
  const base = `${CFG.repo.basePath}/${frontKey}`;
  const arr = await ghList(base);
  const items = arr
    .filter(x=>x.type==='file' && /\.(png|jpe?g|webp)$/i.test(x.name))
    .map(x=>({ name:x.name, url: rawUrl(`${base}/${x.name}`), date: extractDateFromFilename(x.name)}))
    .filter(x=>x.date)
    .sort((a,b)=> a.date - b.date);
  state.filesByFront.set(frontKey, items);
  state.indexByFront.set(frontKey, Math.max(0, items.length-1));
}

/* ===== HOME ===== */
function buildHome(){
  el.grid.innerHTML='';
  CFG.fronts.forEach(f=>{
    const card=document.createElement('button');
    card.className='front-card'; card.type='button';
    card.innerHTML = `<div>${f.display || f.key}<small>${f.key}</small></div>`;
    card.addEventListener('click', ()=>openFront(f.key));
    el.grid.appendChild(card);
  });
  el.homeBg.style.backgroundImage = CFG.homeMap ? `url("${CFG.homeMap}")` : 'linear-gradient(135deg,#eef2ff,#e2e8f0)';
}

/* ===== DETAIL ===== */
function markArrows(idx,len){ el.prev.disabled=(idx<=0); el.next.disabled=(idx>=len-1); }
function setStageBg(url){ el.stage.style.backgroundImage = url ? `url("${url}")` : ''; }
function renderDetail(){
  const key = state.currentKey;
  const meta = CFG.fronts.find(x=>x.key===key);
  if(!meta) return;
  const files = state.filesByFront.get(key) || [];
  const idx = Math.max(0, Math.min(state.indexByFront.get(key) ?? (files.length-1), files.length-1));
  markArrows(idx, files.length);

  document.title = `${meta.display || key} — Ukraine War Updates`;
  el.title.textContent = meta.display || meta.key;

  if(!files.length){
    el.badge.textContent='—';
    el.capLeft.textContent=`אין קבצים ב-${key} בפורמט front-YYYY-M-D`;
    setStageBg(''); setImgError('לא נמצאו תמונות'); return;
  }

  const item = files[idx];
  el.badge.textContent = fmtDate(item.date);
  el.capLeft.textContent = item.name;

  setLoading(true);
  const probe = new Image();
  probe.onload = ()=>{
    setStageBg(item.url);
    el.img.src = item.url;
    el.img.alt = `${meta.display || key} — ${fmtDate(item.date)}`;
    el.capRight.className='status ok';
    el.capRight.textContent='נטען בהצלחה';
    setLoading(false);

    // הכנה להגדלה: נטעין לאוברליי את אותה כתובת
    el.zoomImg.src = item.url;
    resetZoom();
  };
  probe.onerror = ()=> { setStageBg(''); setImgError('שגיאה בטעינת התמונה'); };
  probe.referrerPolicy="no-referrer";
  probe.src=item.url;
}

/* ===== NAV ===== */
async function openFront(key){
  state.currentKey = key;
  if(!state.filesByFront.has(key)){ try{ await loadFrontFiles(key); }catch(e){ console.error(e); state.filesByFront.set(key,[]); } }
  const u = new URL(location.href); u.searchParams.set('front', key); history.replaceState({},'',u);
  showDetail(); renderDetail();
}
function step(delta){
  const key=state.currentKey, files=state.filesByFront.get(key) || [];
  if(!files.length) return;
  const curr=state.indexByFront.get(key) ?? (files.length-1);
  const next=Math.max(0, Math.min(curr+delta, files.length-1));
  if(next!==curr){ state.indexByFront.set(key,next); renderDetail(); }
}
el.prev.addEventListener('click', ()=>step(-1));
el.next.addEventListener('click', ()=>step(+1));
document.addEventListener('keydown', (e)=>{ if(el.detail.style.display!=='block') return; if(e.key==='ArrowLeft') step(-1); if(e.key==='ArrowRight') step(+1); });
el.homeBtn.addEventListener('click', showHome);

/* ===== ZOOM (no blur) ===== */
let zScale=1, zX=0, zY=0, dragging=false, lastX=0, lastY=0;

function applyZoom(){
  el.zoomImg.style.transform = `translate(calc(-50% + ${zX}px), calc(-50% + ${zY}px)) scale(${zScale})`;
}
function resetZoom(){
  zScale = 1; zX=0; zY=0; applyZoom();
}
function openZoom(){
  el.zoomOverlay.style.display='block';
}
function closeZoom(){
  el.zoomOverlay.style.display='none';
}
el.zoomBtn.addEventListener('click', openZoom);
el.zoomClose.addEventListener('click', closeZoom);
el.zoomReset.addEventListener('click', resetZoom);
el.zoomIn.addEventListener('click', ()=>{ zScale = Math.min(8, zScale*1.25); applyZoom(); });
el.zoomOut.addEventListener('click', ()=>{ zScale = Math.max(1, zScale/1.25); applyZoom(); });

// גלגלת – זום סביב מרכז המסך (פשוט ויעיל)
el.zoomOverlay.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const dir = e.deltaY > 0 ? -1 : 1;
  const prev = zScale;
  zScale = Math.min(8, Math.max(1, zScale * (dir>0 ? 1.1 : 1/1.1)));
  // תזוזה קלה כדי להרגיש זום – לא מדויק לנקודת הסמן אבל נח
  const factor = zScale/prev;
  zX *= factor; zY *= factor;
  applyZoom();
},{passive:false});

// גרירה
el.zoomOverlay.addEventListener('pointerdown', (e)=>{ dragging=true; el.zoomOverlay.classList.add('grabbing'); lastX=e.clientX; lastY=e.clientY; });
el.zoomOverlay.addEventListener('pointermove', (e)=>{
  if(!dragging) return;
  zX += (e.clientX - lastX);
  zY += (e.clientY - lastY);
  lastX = e.clientX; lastY = e.clientY;
  applyZoom();
});
['pointerup','pointerleave','pointercancel'].forEach(ev=> el.zoomOverlay.addEventListener(ev, ()=>{ dragging=false; el.zoomOverlay.classList.remove('grabbing'); }));

// דאבל-קליק: טוגל 1x / 2x
el.zoomOverlay.addEventListener('dblclick', ()=>{
  zScale = (zScale===1) ? 2 : 1; zX=0; zY=0; applyZoom();
});

/* ===== INIT ===== */
(async function init(){
  try{
    const res = await fetch('updates.json',{cache:'no-store'});
    if(!res.ok) throw new Error('updates.json missing');
    CFG = await res.json();
    buildHome();
    showHome();
    const urlFront = new URL(location.href).searchParams.get('front');
    if(urlFront && CFG.fronts.find(f=>f.key===urlFront)){ await openFront(urlFront); }
  }catch(err){
    console.error(err);
    alert('שגיאה בטעינת התצורה. ודא שקיים updates.json תקין.');
  }
})();
</script>
</body>
</html>
