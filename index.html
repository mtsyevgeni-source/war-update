<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>עדכוני חזיתות — אוקראינה</title>
  <meta name="description" content="מציג תמונות יומיות לכל גזרת לחימה מתוך GitHub, עם ניווט כרונולוגי." />

  <!-- סגנון בסיסי קליל; אפשר להחליף ל-Tailwind בהמשך -->
  <style>
    :root{
      /* שים כאן קישור למפת הרקע (אפשר קובץ מקומי /assets/ua-map.jpg או קישור RAW מגיטהאב) */
      --map-url: url("assets/ukraine-map-lite.jpg");
      --bg-blur: 8px;
      --brand: #0b6bcb;
      --brand-2: #0d3b66;
      --ink: #0f172a;
      --ink-soft: #334155;
      --panel: rgba(255,255,255,.9);
      --panel-weak: rgba(255,255,255,.6);
      --danger: #dc2626;
      --ok: #059669;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, "Apple Color Emoji","Segoe UI Emoji";
      color: var(--ink);
      background: #f1f5f9;
    }
    .app {
      min-height: 100dvh;
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .hero {
      position: relative;
      min-height: 40vh;
      background-image: var(--map-url);
      background-size: cover;
      background-position: center;
      filter: saturate(0.9);
      isolation: isolate;
    }
    .hero::after{
      content:"";
      position: absolute; inset: 0;
      backdrop-filter: blur(var(--bg-blur));
      background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.75) 40%, rgba(255,255,255,.9));
      z-index: 0;
    }
    header {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px clamp(12px, 3vw, 32px);
    }
    .brand {
      display: flex; align-items: baseline; gap: .5rem;
      font-weight: 700; letter-spacing: .3px;
    }
    .brand .dot { color: var(--brand); }
    .tabs {
      position: relative; z-index: 1;
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 0 clamp(12px, 3vw, 32px) 16px;
    }
    .tab {
      border: 1px solid #e2e8f0; background: var(--panel);
      border-radius: 999px; padding: 8px 14px;
      font-size: 14px; cursor: pointer; user-select: none;
      transition: all .15s ease;
    }
    .tab:hover { transform: translateY(-1px); }
    .tab.active { background: #eaf3ff; border-color: #c7dcff; color: var(--brand-2); font-weight: 700; }

    main {
      position: relative; z-index: 1;
      padding: 16px clamp(12px, 3vw, 32px) 28px;
      display: grid; gap: 16px;
    }
    .panel {
      background: var(--panel); border: 1px solid #e2e8f0; border-radius: 16px;
      padding: clamp(10px, 2vw, 18px);
      box-shadow: 0 10px 26px rgba(2, 6, 23, 0.04);
    }
    .toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .toolbar .title {
      display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; font-weight: 700;
      color: var(--ink);
    }
    .date-badge {
      background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe;
      padding: 4px 10px; border-radius: 999px; font-size: 13px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .controls {
      display: flex; align-items: center; gap: 8px;
    }
    button.nav {
      border: 1px solid #e2e8f0; background: white; color: var(--ink);
      border-radius: 12px; padding: 8px 10px; min-width: 42px;
      cursor: pointer; transition: all .15s ease; font-weight: 700;
    }
    button.nav:disabled { opacity: .45; cursor: not-allowed; }
    button.nav:hover:not(:disabled) { transform: translateY(-1px); background: #f8fafc; }
    .img-wrap {
      position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }
    .img-wrap img {
      width: 100%; height: 100%; object-fit: contain; display: block; background: #0b0b0b;
    }
    .caption {
      font-size: 13px; color: var(--ink-soft);
      display: flex; justify-content: space-between; gap: 8px; margin-top: 6px;
      align-items: center; flex-wrap: wrap;
    }
    .status {
      font-size: 12px; padding: 4px 8px; border-radius: 8px; border: 1px solid #e2e8f0; background: var(--panel-weak);
    }
    .status.ok { border-color: #bbf7d0; background: #ecfdf5; color: #065f46; }
    .status.err { border-color: #fecaca; background: #fef2f2; color: #7f1d1d; }
    .loading {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: repeating-linear-gradient( 45deg, rgba(255,255,255,.0) 0 24px, rgba(255,255,255,.5) 24px 48px );
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%{opacity:.6} 50%{opacity:1} 100%{opacity:.6} }
    footer {
      padding: 14px clamp(12px, 3vw, 32px); color: #475569; font-size: 12px; display:flex; justify-content: space-between; flex-wrap: wrap; gap:8px;
    }
    a{ color: var(--brand-2); text-decoration: none; }
    a:hover{ text-decoration: underline; }
    .sr { position: absolute !important; height: 1px; width: 1px; overflow: hidden; clip: rect(1px, 1px, 1px, 1px); white-space: nowrap; }
  </style>
</head>
<body>
  <div class="app">
    <section class="hero">
      <header>
        <div class="brand">
          <span class="dot">●</span> <span>עדכוני חזיתות — אוקראינה</span>
        </div>
        <div class="hint" aria-hidden="true" style="font-size:12px;color:#334155">
          קיצור דרך: ← / → לניווט תאריכים
        </div>
      </header>

      <nav class="tabs" id="tabs" aria-label="בחירת גזרה">
        <!-- נבנה דינמית -->
      </nav>
    </section>

    <main>
      <div class="panel">
        <div class="toolbar">
          <div class="title">
            <span id="frontTitle">—</span>
            <span class="date-badge" id="dateBadge">—</span>
          </div>
          <div class="controls">
            <button class="nav" id="prevBtn" title="עדכון קודם" aria-label="עדכון קודם">⟵</button>
            <button class="nav" id="nextBtn" title="עדכון הבא" aria-label="עדכון הבא">⟶</button>
          </div>
        </div>

        <div class="img-wrap" id="imgWrap">
          <div class="loading" id="loading" hidden>טוען…</div>
          <img id="frontImage" alt="תמונת עדכון" />
        </div>

        <div class="caption">
          <div id="captionLeft">—</div>
          <div id="captionRight" class="status">—</div>
        </div>
      </div>
    </main>

    <footer>
      <div>מקור התמונות: <span id="repoLinkWrap">—</span></div>
      <div>מצב: <span class="status ok" id="appStatus">מוכן</span></div>
    </footer>
  </div>

  <script>
  // --------- עזרי זמן/תאריך ----------
  const fmtDate = (iso) => {
    try {
      const d = new Date(iso);
      if (isNaN(+d)) return iso;
      return d.toLocaleDateString('he-IL', { year:'numeric', month:'2-digit', day:'2-digit' });
    } catch { return iso; }
  };

  // --------- מצב אפליקציה ----------
  const state = {
    data: null,                // ה-JSON הטעון
    currentFrontKey: null,     // מפתח גזרה (למשל "pokrovsk")
    indices: new Map(),        // מפה frontKey -> אינדקס נוכחי
  };

  // --------- אלמנטים ----------
  const tabsEl       = document.getElementById('tabs');
  const frontTitleEl = document.getElementById('frontTitle');
  const dateBadgeEl  = document.getElementById('dateBadge');
  const imgWrapEl    = document.getElementById('imgWrap');
  const imgEl        = document.getElementById('frontImage');
  const loadingEl    = document.getElementById('loading');
  const prevBtn      = document.getElementById('prevBtn');
  const nextBtn      = document.getElementById('nextBtn');
  const captionLeft  = document.getElementById('captionLeft');
  const captionRight = document.getElementById('captionRight');
  const appStatus    = document.getElementById('appStatus');
  const repoLinkWrap = document.getElementById('repoLinkWrap');

  // --------- טעינת הנתונים ----------
  async function loadUpdates() {
    setAppStatus('טוען עדכונים…');
    try {
      const res = await fetch('updates.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data || !Array.isArray(data.fronts)) throw new Error('מבנה JSON שגוי');
      state.data = data;

      // קישור לריפו בפוטר
      if (data.repo_raw_base) {
        const a = document.createElement('a');
        // מציגים את repo_url אם קיים (ידידותי יותר), אחרת את repo_raw_base
        a.href = data.repo_url || data.repo_raw_base;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = data.repo_name || 'GitHub';
        repoLinkWrap.innerHTML = '';
        repoLinkWrap.appendChild(a);
      } else {
        repoLinkWrap.textContent = 'ללא קישור (בדוק updates.json)';
      }

      buildTabs(data.fronts);
      // אתחול אינדקסים: ברירת מחדל לתמונה הכי עדכנית (האחרונה ברשימה)
      for (const f of data.fronts) {
        const idx = Math.max(0, (f.items?.length || 1) - 1);
        state.indices.set(f.key, idx);
      }

      // תמיכת פרמטר כתובת ?front=xxx
      const urlFront = new URL(location.href).searchParams.get('front');
      const firstKey = urlFront && data.fronts.find(x => x.key === urlFront)?.key || data.fronts[0].key;
      selectFront(firstKey);

      setAppStatus('מוכן', true);
    } catch (err) {
      console.error(err);
      setAppStatus('שגיאה בטעינת updates.json', false);
      captionRight.className = 'status err';
      captionRight.textContent = 'שגיאה בטעינת הנתונים';
    }
  }

  function setAppStatus(msg, ok = true) {
    appStatus.textContent = msg;
    appStatus.className = 'status ' + (ok ? 'ok' : 'err');
  }

  // --------- בניית טאבים ----------
  function buildTabs(fronts) {
    tabsEl.innerHTML = '';
    fronts.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'tab';
      btn.type = 'button';
      btn.textContent = f.display || f.key;
      btn.dataset.front = f.key;
      btn.addEventListener('click', () => selectFront(f.key));
      tabsEl.appendChild(btn);
    });
  }

  function markActiveTab(frontKey) {
    [...tabsEl.querySelectorAll('.tab')].forEach(el => {
      el.classList.toggle('active', el.dataset.front === frontKey);
    });
  }

  // --------- בחירת גזרה ----------
  function selectFront(frontKey) {
    if (!state.data) return;
    const front = state.data.fronts.find(f => f.key === frontKey);
    if (!front) return;
    state.currentFrontKey = frontKey;
    markActiveTab(frontKey);
    render();
    // עדכון ה-URL לשיתוף
    const u = new URL(location.href);
    u.searchParams.set('front', frontKey);
    history.replaceState({}, '', u);
  }

  // --------- רינדור ----------
  function render() {
    const front = getCurrentFront();
    if (!front) return;

    const idx = clampIndex(state.indices.get(front.key) ?? 0, front.items.length);
    state.indices.set(front.key, idx);

    frontTitleEl.textContent = front.display || front.key;
    const item = front.items[idx];
    dateBadgeEl.textContent = item ? fmtDate(item.date) : '—';

    // עדכון כפתורי ניווט
    prevBtn.disabled = (idx <= 0);
    nextBtn.disabled = (idx >= front.items.length - 1);

    // כיתוב שמאל
    captionLeft.textContent = item?.caption || (item?.filename || '');

    // טעינת התמונה עם מציין "טוען…"
    setLoading(true);
    if (!item?.image_url) {
      setImageError('אין image_url לנתון הזה');
      return;
    }

    const img = new Image();
    img.onload = () => {
      imgEl.src = item.image_url;
      imgEl.alt = item.alt || `עדכון ${front.display} — ${fmtDate(item.date)}`;
      captionRight.className = 'status ok';
      captionRight.textContent = 'נטען בהצלחה';
      setLoading(false);
      // קדם-טעינה קלילה לשכנים
      preloadNeighbors(front, idx);
    };
    img.onerror = () => setImageError('שגיאה בטעינת התמונה');
    img.referrerPolicy = "no-referrer";
    img.src = item.image_url;
  }

  function setLoading(on) {
    loadingEl.hidden = !on;
  }
  function setImageError(msg) {
    imgEl.removeAttribute('src');
    captionRight.className = 'status err';
    captionRight.textContent = msg;
    setLoading(false);
  }
  function clampIndex(i, len) {
    if (len <= 0) return 0;
    return Math.max(0, Math.min(i, len - 1));
  }
  function getCurrentFront() {
    return state.data?.fronts.find(f => f.key === state.currentFrontKey);
  }

  // --------- ניווט ----------
  prevBtn.addEventListener('click', () => step(-1));
  nextBtn.addEventListener('click', () => step(+1));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(+1);
  });

  function step(delta) {
    const front = getCurrentFront();
    if (!front) return;
    const curr = state.indices.get(front.key) ?? 0;
    const next = clampIndex(curr + delta, front.items.length);
    if (next !== curr) {
      state.indices.set(front.key, next);
      render();
    }
  }

  // --------- קדם-טעינה ----------
  function preloadNeighbors(front, idx) {
    const list = [];
    if (idx + 1 < front.items.length) list.push(front.items[idx + 1].image_url);
    if (idx - 1 >= 0) list.push(front.items[idx - 1].image_url);
    list.filter(Boolean).forEach(url => {
      const i = new Image(); i.referrerPolicy = "no-referrer"; i.src = url;
    });
  }

  // --------- התחלה ----------
  loadUpdates();
  </script>
</body>
</html>
